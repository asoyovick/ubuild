services:
  - type: web
    name: ubuild-frontend
    runtime: node
    plan: free
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/backend
      - key: UBUILD_API_URL
        value: https://ubuild-api.onrender.com
  - type: web
    name: ubuild-api
    runtime: go
    plan: starter
    branch: develop
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ubuild-db
          property: connectionString
      - key: UBUILD_ALLOWED_ORIGIN
        sync: false
      - key: UBUILD_COOKIE_SECURE
        value: "true"
databases:
  - name: ubuild-db
    databaseName: ubuild
    user: ubuild
    plan: basic-256mb
