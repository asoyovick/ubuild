services:
  - type: web
    name: ubuild
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "3000"
      - key: BACKEND_PORT
        value: "8080"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/backend
      - key: UBUILD_API_URL
        value: http://127.0.0.1:8080
      - key: DATABASE_URL
        sync: false
      - key: UBUILD_ALLOWED_ORIGIN
        sync: false
      - key: UBUILD_SUPABASE_DB_HOST
        value: aws-0-eu-west-2.pooler.supabase.com
      - key: UBUILD_SUPABASE_DB_PORT
        value: "5432"
      - key: UBUILD_SUPABASE_DB_NAME
        value: postgres
      - key: UBUILD_SUPABASE_DB_USER
        value: postgres.etahikzwgcbkckbahavl
      - key: UBUILD_COOKIE_SECURE
        value: "true"
      - key: UBUILD_POSTGRES_TLS
        value: "false"
      - key: UBUILD_UPLOAD_DIR
        value: /app/backend/data/uploads
