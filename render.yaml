services:
  - type: web
    name: ubuild
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: |
      cd backend && go build -o bin/api ./cmd/api
      cd ../frontend && npm ci && npm run build
    startCommand: bash scripts/start-services.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "3000"
      - key: BACKEND_PORT
        value: "8080"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/backend
      - key: UBUILD_API_URL
        value: http://127.0.0.1:8080
      - key: DATABASE_URL
        sync: false
      - key: UBUILD_ALLOWED_ORIGIN
        sync: false
      - key: UBUILD_COOKIE_SECURE
        value: "true"
