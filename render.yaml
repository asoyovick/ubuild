services:
  # Next.js web service
  - type: web
    name: ubuild
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
